<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Management System</title>
</head>
<body>

<!-- Heading Panel -->
<h1>College Management System</h1>

<!--Manage / Selection Panel-->
<label for="manage">Manage</label>
<select id="manage">
    <option value="student">Student</option>
    <option value="department">Department</option>
    <option value="professor">Professor</option>
    <option value="hod">HODs</option>
</select>

<!--Student Part-->
<table id="studentTable" class="studentTableStyle">
    <thead>
    <tr>
        <th>ID</th>
        <th>Roll no.</th>
        <th>Name</th>
        <th>Department</th>
        <th>Contact no.</th>
        <th>Email ID</th>
        <th colspan="2">Action</th>
    </tr>
    </thead>
    <tbody id="studentTableBody">
    <!--        Students Data and Operations will appear here-->
    </tbody>
</table>
<div id="studentAddButton">
    Add new student <button>+</button>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
