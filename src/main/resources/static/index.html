<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Heading Panel -->
<h1>College Management System</h1>

<!--Manage / Selection cum Add Panel-->
<div class="toolbar">
    <label for="manage">Manage</label>
    <select id="manage">
        <option value="student">Student</option>
        <option value="department">Department</option>
        <option value="professor">Professor</option>
        <option value="hod">HODs</option>
    </select>
</div>

<!--Student Part-->
<form id="addStudentForm" class="entity-form">
    <label for="name">Enter Name: </label>
    <input id="name" type="text"><br><br>
    <label for="rollNo">Roll No. </label>
    <input id="rollNo" type="number"><br><br>
    <div class="toolbar">
        <label for="departmentSelectionMenu">Select Department</label>
        <select id="departmentSelectionMenu"></select>
    </div>
    <label for="contactNo">Contact No. </label>
    <input id="contactNo" type="text"><br><br>
    <label for="email">Email Id: </label>
    <input id="email" type="email"><br><br>
    <div class="form-buttons">
        <button id="cancel" type="button">Cancel</button>
        <button type="reset">Reset</button>
        <button type="submit">Add</button>
    </div>
</form>

<table id="studentTable">
    <thead>
    <tr>
        <th>Roll no.</th>
        <th>Name</th>
        <th>Department</th>
        <th>Contact no.</th>
        <th>Email ID</th>
        <th colspan="2">
            <span style="padding-right: 15px">Action </span>
            <button type="button" id="showAddStudentForm" class="add-btn">Add New +</button>
        </th>
    </tr>
    </thead>
    <tbody id="studentTableBody">
    <!--        Students Data and Operations will appear here-->
    </tbody>
</table>

<script type="module" src="./js/main.js"></script>
</body>
</html>
